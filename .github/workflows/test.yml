# Runs the app's unit tests and the addon's multi-client simulation on every push.
name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: companion/package-lock.json
      - run: npm ci
        working-directory: companion
      - run: npm test
        working-directory: companion
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install lupa
      - run: python3 addon/test/sim.py
